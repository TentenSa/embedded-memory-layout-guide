name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example map must pass
        run: python tools/check_layout.py examples/dualcore-baseline/link-output/firmware.map examples/dualcore-baseline/config/layout.toml
      - name: Stale example map must fail
        run: |
          if python tools/check_layout.py examples/dualcore-baseline/link-output/firmware_stale.map examples/dualcore-baseline/config/layout.toml; then
            echo "stale map was accepted"; exit 1
          fi
      - name: Migration example, old map with old declarations must pass
        run: python tools/check_layout.py examples/migration-device-upgrade/old/firmware.map examples/migration-device-upgrade/old/layout.toml
      - name: Migration example, new map with old declarations must fail
        run: |
          if python tools/check_layout.py examples/migration-device-upgrade/new/firmware.map examples/migration-device-upgrade/old/layout.toml; then
            echo "stale declarations were accepted"; exit 1
          fi
      - name: Migration example, new map with new declarations must pass
        run: python tools/check_layout.py examples/migration-device-upgrade/new/firmware.map examples/migration-device-upgrade/new/layout.toml
      - name: Boot failure example, before and after builds must pass
        run: |
          python tools/check_layout.py examples/boot-failure-csa-depletion/before/firmware.map examples/boot-failure-csa-depletion/before/layout.toml
          python tools/check_layout.py examples/boot-failure-csa-depletion/after/firmware.map examples/boot-failure-csa-depletion/after/layout.toml
      - name: Boot failure example, after build with stale declaration must fail
        run: |
          if python tools/check_layout.py examples/boot-failure-csa-depletion/after/firmware.map examples/boot-failure-csa-depletion/before/layout.toml; then
            echo "stale declaration was accepted"; exit 1
          fi
